services:
  researchforge:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RESEARCHFORGE_DB: /data/researchforge.db
      RESEARCHFORGE_API_KEY: ${RESEARCHFORGE_API_KEY:?Set RESEARCHFORGE_API_KEY}
    volumes:
      - researchforge_data:/data
    restart: unless-stopped
volumes:
  researchforge_data:
