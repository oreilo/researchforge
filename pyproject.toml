[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[project]
name = "oreilo-researchforge"
version = "2.0.0"
description = "Evidence-first web research and report generation toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "OREiLO"}]
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "typer>=0.12,<1", "rich>=13,<15", "pydantic>=2.6,<3", "jinja2>=3.1,<4"]
[project.optional-dependencies]
ai = ["openai>=1.50,<3"]
server = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
documents = ["pymupdf>=1.24,<2", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "reportlab>=4,<5"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1", "respx>=0.21,<1"]
[project.scripts]
researchforge = "oreilo_researchforge.cli:app"
[tool.hatch.build.targets.wheel]
packages = ["src/oreilo_researchforge"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
